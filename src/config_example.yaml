# --- File Paths ---
paths:
  simu_bulk_dir: "./datasets/simulated_bulk_cell_dataset"
  tcga2cancer_type_file_path: "path/to/tcga_sample_id2cancer_type.csv"
  tcga_merged_tpm_file_path: "path/to/merged_tpm.csv"
  high_corr_gene_file_path: "path/to/gene_list_filtered_by_high_corr_gene.csv"  # Optional shared fallback high-correlation gene list for Mixed filtering; set to null for a clean first run
  merged_sc_dataset_file_path: "path/to/merged_sc_dataset.h5ad"
  sorted_bulk_expr_file_path: "path/to/sorted_bulk_expr.tsv"  # Optional: sorted bulk reference expression matrix for SCT post-imputation
  sorted_bulk_annot_file_path: "path/to/sorted_bulk_annot.tsv"  # Optional: annotation table for the sorted bulk reference
  sorted_bulk_cell_type_mapping_file_path: "path/to/cell_type_mapping.csv"  # Optional: mapping between SCT and sorted-bulk cell types

# --- Biological Constants ---
constants:
  # List of single-cell RNA-seq datasets
  sc_dataset_ids:
    - "hnscc_cillo_01"
    - "pdac_peng_02"
    - "hnscc_puram_03"
    - "pdac_steele_04"
    - "luad_kim_05"
    - "nsclc_guo_06"
    - "pan_cancer_07"
    - "prad_cheng_08"
    - "prad_dong_09"
    - "hcc_sun_10"
    - "gbm_neftel_11"
    - "gbm_abdelfattah_12"

  # Cell types and their corresponding subtypes
  cell_type2subtypes:
    B Cells: ["Non-plasma B cells", "Plasma B cells"]
    CD4 T: ["CD4 T conv", "CD4 Treg"]
    CD8 T: ["CD8 T (GZMK high)", "CD8 T effector"]
    DC: ["mDC", "pDC"]
    Endothelial Cells: ["Endothelial Cells"]
    Cancer Cells: ["Cancer Cells"]
    Fibroblasts: ["CAFs", "Myofibroblasts"]
    Macrophages: ["Macrophages"]
    Mast Cells: ["Mast Cells"]
    NK: ["NK"]
    Neutrophils: ["Neutrophils"]
    Double-neg-like T: ["Double-neg-like T"]
    Monocytes: ["Monocytes"]

  # Using this parameter (a list) to specify which cell types (or subtypes) should be output and include in the simulated bulk samples
  output_types:
    - "Non-plasma B cells"
    - "Plasma B cells"
    - "CD4 T"
    - "CD8 T (GZMK high)"
    - "CD8 T effector"
    - "DC"
    - "Endothelial Cells"
    - "Cancer Cells"
    - "CAFs"
    - "Myofibroblasts"
    - "Macrophages"
    - "Mast Cells"
    - "NK"
    - "Neutrophils"
    - "Double-neg-like T"
    - "Monocytes"

  # Coefficient to correct total RNA abundance
  total_rna_coefficient:
    B Cells: 1.0
    CD4 T: 1.0
    CD8 T: 1.0
    DC: 1.0
    Endothelial Cells: 1.0
    Cancer Cells: 1.0
    Fibroblasts: 1.0
    Macrophages: 1.0
    Mast Cells: 1.0
    NK: 1.0
    Neutrophils: 1.0
    Double-neg-like T: 1.0
    Monocytes: 1.0

# --- Global Simulation Parameters ---
parameters:
  gene_quantile_range: [0.005, 0.5, 0.995]
  gep_filtering_quantile: [0.0, 0.95]
  pca_n_components: 0.9
  gene_list_type: "high_corr_gene"  # Legacy fallback name; correlation-first mode is the default
  gep_filtering_enabled_default: false  # Optional global default for Mixed GEP-level filtering when a dataset does not set `gep_filtering`
  gep_filtering_reference_file: "path/to/merged_tpm.csv"  # Optional TCGA-like reference used for Mixed GEP-level filtering; defaults to paths.tcga_merged_tpm_file_path
  gep_filtering_ref_exp_type: "TPM"  # Optional reference expression type for GEP-level filtering
  gep_filtering_method: "median_gep"  # Use "knn" for held-out neighbor filtering or "knn_residual" to also require a residual cutoff
  gep_n_top: 20  # Optional neighbor count for marker-ratio filtering
  gep_show_filtering_info: false  # Optional verbose logging for GEP-level filtering
  gep_filtering_by_gene_range: false  # Optional extra per-sample gene-range filtering during Mixed generation
  gep_min_percentage_within_gene_range: 0.95  # Optional minimum gene fraction required to pass gene-range filtering
  gep_gene_quantile_range: [0.005, 0.5, 0.995]  # Optional TCGA quantile triplet used by GEP-level gene-range filtering
  gep_filtering_in_pca_space: true  # Optional PCA-space distance filtering during Mixed generation
  gep_pca_n_components: 0.9  # Optional PCA dimensionality or explained-variance target for GEP-level filtering
  gep_norm_ord: 1  # Optional norm order for GEP-level distance filtering
  gep_reference_holdout_fraction: 0.2  # knn/knn_residual: ceil(20% of samples) per cancer type for calibration
  gep_reference_holdout_seed: 42  # Dedicated reference-split seed, independent of simulation seeds
  gep_knn_n_neighbors: 10  # knn/knn_residual: number of nearest fitting TCGA samples
  gep_knn_distance_quantile: 0.95  # Held-out neighbor-distance upper cutoff
  gep_pca_residual_quantile: 0.95  # Held-out residual percentile; diagnostic only in "knn", acceptance cutoff in "knn_residual"
  gep_max_generation_batches: 100  # knn/knn_residual: cumulative candidate-batch bound, preserved on resume
  gene_filtering_enabled_default: false  # Optional global default for Mixed gene-level filtering when a dataset does not set `gene_filtering`
  gene_filtering_reference_file: "path/to/merged_tpm.csv"  # Reference for selecting shared genes and normalization when GEP filtering is disabled
  gene_filtering_type: "high_corr_gene"  # Select genes before target generation; no expression-range gene selection
  calculate_gene_cell_prop_correlation: false  # Optional switch for saving a full, unfiltered Mixed gene/cell-fraction correlation matrix
  gene_filtering_correlation_reference_dataset: null  # Required earlier unfiltered segment source when gene filtering has no supplied gene list
  gene_filtering_corr_threshold: 0.3  # Optional minimum gene/cell-fraction correlation threshold
  gene_filtering_reference_variance_threshold: 1.0  # Retain reference genes with population variance > 1 TPM^2 before fixed-G selection; local KNN uses fitting samples only. Renormalize on final G. null disables; unfiltered correlation sources are unchanged.
  gene_filtering_n_gene_max: 1000  # Optional maximum number of genes kept per cell type for correlation-based filtering
  gene_filtering_save_filtered_h5ad: true  # Optional additional named export; the primary Mixed `.h5ad` already contains only G
  gene_filtering_filtered_dataset_postfix: null  # Optional postfix for the filtered Mixed `.h5ad`; null keeps the default `filtered_by_<gene_filtering_type>` naming
  plot_pca_for_comparison: true  # Optional Mixed-versus-TCGA PCA plotting switch; works with or without gene filtering
  gene_filtering_pca_n_components: 2  # Optional PCA component count for comparison plots; must be >= 2 when plotting is enabled
  gene_filtering_pca_figsize: [5, 5]  # Optional figure size for comparison plots
  n_base: 100
  sorted_bulk_cell_type_col: "Tumor_model_annot"  # Optional: cell-type column in sorted_bulk_annot_file_path
  sorted_bulk_imputation_eps: 1.0e-8  # Optional: zero threshold for sparsity and imputation
  sorted_bulk_imputation_seed: 123  # Optional: random seed for diagnostic sampling during sorted-bulk-guided SCT imputation
  dirichlet_sampling_seed: 123  # Optional: seed for reproducible Dirichlet cell-fraction draws
  sorted_bulk_imputation_batch_size: 128  # Optional: batch size during SCT imputation
  sorted_bulk_imputation_boxplot_sample_size: 1000  # Optional: sample size for SCT boxplot rendering
  sorted_bulk_imputation_bulk_weight: 0.5  # Optional: sorted-bulk contribution for the included==1 averaging branch; 0.5 keeps the previous 50/50 blend
  sorted_bulk_imputation_y_frac_threshold: 0.15  # Optional: cap for the newly added expression fraction in each SCT sample
  sorted_bulk_imputation_output_suffix: "_sorted_bulk_imputed"  # Optional: suffix appended to the imputed SCT h5ad
  run_sample_diversity_analysis: true  # Optional: run sample-diversity analysis after each SCT dataset is generated
  sample_diversity_gene_mode: "all"  # Optional: "all", "hvg", or "provided_gene_list"
  sample_diversity_n_top_genes: 2000  # Optional: only used when sample_diversity_gene_mode is "hvg"
  sample_diversity_gene_list_path: null  # Optional: path to a gene list file when sample_diversity_gene_mode is "provided_gene_list"
  sample_diversity_distance_metric: "cosine"  # Optional: "cosine" or "l2"
  sample_diversity_min_samples_per_cell_type: 5  # Optional: skip cell types with fewer samples than this threshold
  stratify_by_dataset: "none"   # Optional: "none" (default) or "balanced_quota". "balanced_quota" downsamples each (cell_type, dataset_id) group to the size of the smallest dataset still containing that cell type, preventing large datasets from dominating the candidate pool. Can also be overridden per-SCT dataset below.
  mixed_sct_loading_mode: "auto"  # Optional Mixed-only SCT loading mode: "auto" prefers eager loading for smaller SCT references and lazy backed loading for larger ones; use "eager" for maximum speed when RAM is sufficient, or "lazy" to minimize memory usage.
  mixed_sct_auto_eager_max_gb: 4.0  # Optional threshold used only when mixed_sct_loading_mode is "auto"; eager loading is selected when the estimated dense float32 SCT matrix size is <= this value in GiB.

# --- Datasets to Generate ---
# Define specific parameters for each dataset here.
# If a Mixed dataset depends on an SCT dataset generated earlier in the same
# run, place the SCT dataset earlier than the Mixed dataset in this section and
# reference it explicitly through `sct_reference`.
datasets:
  SCT_N10_hnscc_07Jan_01:  # Dataset name
    dataset_type: "SCT"  # Type of dataset: "SCT" or "Mixed"
    n_samples: 10  # Number of bulk samples to simulate for each cell type
    sampling_method_gep: "n_neighbors"  # Required for SCT datasets: sampling method for finding single cells, either "random" or "n_neighbors"
    neighbor_sampling_scheme: "single_anchor"  # Optional SCT-only: "single_anchor" (default) keeps the existing one-anchor neighbor sampling; "two_half_anchor" builds one SCT sample from two half-sized neighbor groups and softly prefers different datasets for the two halves when feasible.
    stratify_by_dataset: "none"   # Keep all eligible dataset rows; "balanced_quota" intentionally downsamples larger dataset pools.
    cancer_cell_dataset_ids: ["hnscc_puram_03"]  # Optional for SCT only: restrict rows with cell_type == "Cancer Cells" to these dataset_id values
    non_cancer_cell_dataset_ids: ["hnscc_cillo_01", "pdac_peng_02", "hnscc_puram_03", "pdac_steele_04", "luad_kim_05", "nsclc_guo_06", "prad_cheng_08", "prad_dong_09", "hcc_sun_10", "gbm_neftel_11", "gbm_abdelfattah_12"]  # Optional for SCT only: restrict all non-cancer rows to these dataset_id values; later Mixed datasets inherit this through the generated SCT dataset
    selected_subtypes_by_cell_type:  # Optional SCT-only override: restrict the single-cell candidate pool for a parent cell type while keeping the generated SCT label as the parent cell type; use "auto" to randomly choose the parent pool or one configured subtype per sample
      DC: "auto"  # Example: each generated "DC" sample draws from all DC subtypes or one randomly selected subtype
    apply_sorted_bulk_imputation: true  # Optional post-step; if true, SimuTME records both the original and `_sorted_bulk_imputed` SCT outputs for later explicit Mixed references
    run_sample_diversity_analysis: true  # Optional SCT-only post-step; saves sample-diversity outputs under <output_parent>/<dataset_name>/sample_diversity/
    zero_ratio_threshold: 0.97  # Threshold for zero ratio filtering, only for "SCT" datasets and cells with higher zero ratio will be removed
    cell_type_col: "cell_type"  # Column name for cell types in single-cell dataset
    cell_subtype_col: "cell_subtype"  # Column name for cell subtypes in single-cell dataset
    max_cells_per_cell_type: "all"  # All eligible cells remain anchors/neighbors; exact queries run only for sampled anchors. Positive integers retain capped precomputation. "all" requires single_anchor without patient constraints.
  Mixed_N100_segment:  # Dataset name
    dataset_type: "Mixed"  # Type of dataset: "SCT" or "Mixed"
    sct_reference:
      source_type: "path"  # Mixed only: use an external SCT `.h5ad` directly
      file_path: "path/to/sct_dataset_gepsamp-random.h5ad"
    n_samples: 100  # Number of bulk samples to simulate for each cell type
    sampling_method_prop: "segment"  # Proportion sampling: 'segment', 'seg_random', 'sparse', 'random', 'dirichlet', 'mixed'
    gep_filtering: true  # Mixed dataset switch for GEP-level filtering during bulk generation
    filtering_ref_types: null  # Optional TCGA subtype subset used during GEP-level filtering
    gene_filtering: true  # Mixed dataset switch for post-generation gene-level filtering
    cell_prop_prior: null
    gep_filtering_method: "median_gep"  # Optional Mixed override for GEP-level filtering
    filtering_in_pca_space: true  # Optional legacy Mixed override kept for GEP-level PCA-space filtering
    zero_ratio_threshold: 0.97  # Threshold for zero ratio filtering, only for "SCT" datasets and cells with higher zero ratio will be removed
    cell_type_col: "cell_type"  # Column name for cell types in single-cell dataset
    cell_subtype_col: "cell_subtype"  # Column name for cell subtypes in single-cell dataset
  Mixed_N100_dirichlet:  # Dataset name
    dataset_type: "Mixed"  # Type of dataset: "SCT" or "Mixed"
    sct_reference:
      source_type: "generated_dataset"  # Mixed only: reference an SCT dataset defined earlier in this YAML
      dataset_name: "SCT_N10_hnscc_07Jan_01"
      version: "sorted_bulk_imputed"  # Select the imputed SCT output; requires apply_sorted_bulk_imputation: true on the referenced SCT dataset. Use "original" for its pre-imputation output.
    n_samples: 100  # Number of bulk samples to simulate for each cell type
    sampling_method_prop: "dirichlet"  # Proportion sampling: 'segment', 'seg_random', 'sparse', 'random', 'dirichlet', 'mixed'
    dirichlet_alpha:  # Mixed + dirichlet only: default symmetric prior over the 16 configured output cell types
      Non-plasma B cells: 1.0
      Plasma B cells: 1.0
      CD4 T: 1.0
      CD8 T (GZMK high): 1.0
      CD8 T effector: 1.0
      DC: 1.0
      Endothelial Cells: 1.0
      Cancer Cells: 1.0
      CAFs: 1.0
      Myofibroblasts: 1.0
      Macrophages: 1.0
      Mast Cells: 1.0
      NK: 1.0
      Neutrophils: 1.0
      Double-neg-like T: 1.0
      Monocytes: 1.0
    pred_cell_prop_file_path: null  # Mixed + dirichlet only: optional CSV of predicted cell proportions; when provided, estimate dirichlet_alpha from this file and override the manual dictionary
    gep_filtering: true  # Mixed dataset switch for GEP-level filtering during bulk generation
    filtering_ref_types: null  # Optional TCGA subtype subset used during GEP-level filtering
    gene_filtering: true  # Mixed dataset switch for post-generation gene-level filtering
    cell_prop_prior: null
    gep_filtering_method: "mean_gep"  # Example Mixed override for GEP-level filtering
    gep_filtering_quantile: [0.0, 0.98]  # Example Mixed override for GEP-level distance thresholds
    gene_filtering_type: "high_corr_gene"  # Example Mixed override for post-generation filtering
    plot_pca_for_comparison: false  # Example Mixed override that skips PCA artifacts but still writes the filtered `.h5ad`
    zero_ratio_threshold: 0.97  # Threshold for zero ratio filtering, only for "SCT" datasets and cells with higher zero ratio will be removed
    cell_type_col: "cell_type"  # Column name for cell types in single-cell dataset
    cell_subtype_col: "cell_subtype"  # Column name for cell subtypes in single-cell dataset
