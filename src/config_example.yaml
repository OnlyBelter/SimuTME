# --- File Paths ---
paths:
  simu_bulk_dir: "./datasets/simulated_bulk_cell_dataset"
  sct_dataset_file_path: "path/to/sct_dataset_gepsamp-random.h5ad"
  tcga2cancer_type_file_path: "path/to/tcga_sample_id2cancer_type.csv"
  tcga_merged_tpm_file_path: "path/to/merged_tpm.csv"
  high_corr_gene_file_path: "path/to/gene_list_filtered_by_high_corr_gene.csv"
  merged_sc_dataset_file_path: "path/to/merged_sc_dataset.h5ad"
  sorted_bulk_expr_file_path: "path/to/sorted_bulk_expr.tsv"  # Optional: sorted bulk reference expression matrix for SCT post-imputation
  sorted_bulk_annot_file_path: "path/to/sorted_bulk_annot.tsv"  # Optional: annotation table for the sorted bulk reference
  sorted_bulk_cell_type_mapping_file_path: "path/to/cell_type_mapping.csv"  # Optional: mapping between SCT and sorted-bulk cell types
  sorted_bulk_imputation_out_dir: "./datasets/simulated_bulk_cell_dataset/generated_sct_dataset_outputs"  # Optional parent dir; results are saved under <this_dir>/<dataset_name>/

# --- Biological Constants ---
constants:
  # List of single-cell RNA-seq datasets
  sc_dataset_ids:
    - "hnscc_cillo_01"
    - "pdac_peng_02"
    - "hnscc_puram_03"
    - "pdac_steele_04"
    - "luad_kim_05"
    - "nsclc_guo_06"
    - "pan_cancer_07"
    - "prad_cheng_08"
    - "prad_dong_09"
    - "hcc_sun_10"
    - "gbm_neftel_11"
    - "gbm_abdelfattah_12"

  # Cell types and their corresponding subtypes
  cell_type2subtypes:
    B Cells: ["Non-plasma B cells", "Plasma B cells"]
    CD4 T: ["CD4 T"]
    CD8 T: ["CD8 T (GZMK high)", "CD8 T effector"]
    DC: ["DC"]
    Endothelial Cells: ["Endothelial Cells"]
    Cancer Cells: ["Cancer Cells"]
    Fibroblasts: ["CAFs", "Myofibroblasts"]
    Macrophages: ["Macrophages"]
    Mast Cells: ["Mast Cells"]
    NK: ["NK"]
    Neutrophils: ["Neutrophils"]
    Double-neg-like T: ["Double-neg-like T"]
    Monocytes: ["Monocytes"]

  # Using this parameter (a list) to specify which cell types (or subtypes) should be output and include in the simulated bulk samples
  output_types:
    - "Non-plasma B cells"
    - "Plasma B cells"
    - "CD4 T"
    - "CD8 T (GZMK high)"
    - "CD8 T effector"
    - "DC"
    - "Endothelial Cells"
    - "Cancer Cells"
    - "CAFs"
    - "Myofibroblasts"
    - "Macrophages"
    - "Mast Cells"
    - "NK"
    - "Neutrophils"
    - "Double-neg-like T"
    - "Monocytes"

  # Coefficient to correct total RNA abundance
  total_rna_coefficient:
    B Cells: 1.0
    CD4 T: 1.0
    CD8 T: 1.0
    DC: 1.0
    Endothelial Cells: 1.0
    Cancer Cells: 1.0
    Fibroblasts: 1.0
    Macrophages: 1.0
    Mast Cells: 1.0
    NK: 1.0
    Neutrophils: 1.0
    Double-neg-like T: 1.0
    Monocytes: 1.0

# --- Global Simulation Parameters ---
parameters:
  gene_quantile_range: [0.005, 0.5, 0.995]
  gep_filtering_quantile: [0.0, 0.95]
  pca_n_components: 0.9
  gene_list_type: "high_corr_gene_and_quantile_range"
  n_base: 100
  sorted_bulk_cell_type_col: "Tumor_model_annot"  # Optional: cell-type column in sorted_bulk_annot_file_path
  sorted_bulk_imputation_eps: 1.0e-8  # Optional: zero threshold for sparsity and imputation
  sorted_bulk_imputation_seed: 123  # Optional: random seed for diagnostic sampling during sorted-bulk-guided SCT imputation
  sorted_bulk_imputation_batch_size: 128  # Optional: batch size during SCT imputation
  sorted_bulk_imputation_boxplot_sample_size: 1000  # Optional: sample size for SCT boxplot rendering
  sorted_bulk_imputation_bulk_weight: 0.5  # Optional: sorted-bulk contribution for the included==1 averaging branch; 0.5 keeps the previous 50/50 blend
  sorted_bulk_imputation_y_frac_threshold: 0.15  # Optional: cap for the newly added expression fraction in each SCT sample
  sorted_bulk_imputation_output_suffix: "_sorted_bulk_imputed"  # Optional: suffix appended to the imputed SCT h5ad
  run_sample_diversity_analysis: true  # Optional: run sample-diversity analysis after each SCT dataset is generated
  sample_diversity_gene_mode: "all"  # Optional: "all", "hvg", or "provided_gene_list"
  sample_diversity_n_top_genes: 2000  # Optional: only used when sample_diversity_gene_mode is "hvg"
  sample_diversity_gene_list_path: null  # Optional: path to a gene list file when sample_diversity_gene_mode is "provided_gene_list"
  sample_diversity_distance_metric: "cosine"  # Optional: "cosine" or "l2"
  sample_diversity_min_samples_per_cell_type: 5  # Optional: skip cell types with fewer samples than this threshold

# --- Datasets to Generate ---
# Define specific parameters for each dataset here.
# If a Mixed dataset depends on an SCT dataset generated earlier in the same
# run, place the SCT dataset earlier than the Mixed dataset in this section.
# Mixed datasets can then choose which SCT version to use through
# `sct_dataset_version: "original"` or `"sorted_bulk_imputed"`.
datasets:
  SCT_N10_hnscc_07Jan_01:  # Dataset name
    dataset_type: "SCT"  # Type of dataset: "SCT" or "Mixed"
    n_samples: 10  # Number of bulk samples to simulate for each cell type
    sampling_method_gep: "n_neighbors"  # Sampling method for finding single cells: 'random', 'n_neighbors'
    cancer_cell_dataset_ids: ["hnscc_puram_03"]  # Optional for SCT only: restrict rows with cell_type == "Cancer Cells" to these dataset_id values
    non_cancer_cell_dataset_ids: ["hnscc_cillo_01", "pdac_peng_02", "hnscc_puram_03", "pdac_steele_04", "luad_kim_05", "nsclc_guo_06", "prad_cheng_08", "prad_dong_09", "hcc_sun_10", "gbm_neftel_11", "gbm_abdelfattah_12"]  # Optional for SCT only: restrict all non-cancer rows to these dataset_id values; later Mixed datasets inherit this through the generated SCT dataset
    apply_sorted_bulk_imputation: false  # Optional post-step; if true, an imputed SCT file is generated and later Mixed datasets can select it with `sct_dataset_version: "sorted_bulk_imputed"`
    run_sample_diversity_analysis: true  # Optional SCT-only post-step; saves sample-diversity outputs under <output_parent>/<dataset_name>/sample_diversity/
    filtering: false  # Whether to apply gene filtering and TCGA-guided filtering
    filtering_ref_types: null
    cell_prop_prior: null
    zero_ratio_threshold: 0.97  # Threshold for zero ratio filtering, only for "SCT" datasets and cells with higher zero ratio will be removed
    cell_type_col: "cell_type"  # Column name for cell types in single-cell dataset
    cell_subtype_col: "cell_subtype"  # Column name for cell subtypes in single-cell dataset
    max_cells_per_cell_type: 15000  # Maximum number of single cells to use per cell type to avoid memory issues when using n_neighbors sampling
  Mixed_N100_segment:  # Dataset name
    dataset_type: "Mixed"  # Type of dataset: "SCT" or "Mixed"
    sct_dataset_version: "sorted_bulk_imputed"  # Mixed only: use "original" for paths.sct_dataset_file_path, or "sorted_bulk_imputed" to infer the imputed SCT path from paths.sct_dataset_file_path plus sorted_bulk_imputation_output_suffix
    n_samples: 100  # Number of bulk samples to simulate for each cell type
    sampling_method_prop: "segment"  # Proportion sampling: 'segment', 'seg_random', 'sparse', 'random', 'dirichlet', 'mixed'
    filtering: true  # Whether to apply gene filtering and TCGA-guided filtering
    filtering_ref_types: null
    cell_prop_prior: null
    zero_ratio_threshold: 0.97  # Threshold for zero ratio filtering, only for "SCT" datasets and cells with higher zero ratio will be removed
    cell_type_col: "cell_type"  # Column name for cell types in single-cell dataset
    cell_subtype_col: "cell_subtype"  # Column name for cell subtypes in single-cell dataset
  Mixed_N100_dirichlet:  # Dataset name
    dataset_type: "Mixed"  # Type of dataset: "SCT" or "Mixed"
    sct_dataset_version: "sorted_bulk_imputed"  # Mixed only: use "original" for paths.sct_dataset_file_path, or "sorted_bulk_imputed" to infer the imputed SCT path from paths.sct_dataset_file_path plus sorted_bulk_imputation_output_suffix
    n_samples: 100  # Number of bulk samples to simulate for each cell type
    sampling_method_prop: "dirichlet"  # Proportion sampling: 'segment', 'seg_random', 'sparse', 'random', 'dirichlet', 'mixed'
    dirichlet_alpha:  # Mixed + dirichlet only: default symmetric prior over the 16 configured output cell types
      Non-plasma B cells: 1.0
      Plasma B cells: 1.0
      CD4 T: 1.0
      CD8 T (GZMK high): 1.0
      CD8 T effector: 1.0
      DC: 1.0
      Endothelial Cells: 1.0
      Cancer Cells: 1.0
      CAFs: 1.0
      Myofibroblasts: 1.0
      Macrophages: 1.0
      Mast Cells: 1.0
      NK: 1.0
      Neutrophils: 1.0
      Double-neg-like T: 1.0
      Monocytes: 1.0
    pred_cell_prop_file_path: null  # Mixed + dirichlet only: optional CSV of predicted cell proportions; when provided, estimate dirichlet_alpha from this file and override the manual dictionary
    filtering: true  # Whether to apply gene filtering and TCGA-guided filtering
    filtering_ref_types: null
    cell_prop_prior: null
    zero_ratio_threshold: 0.97  # Threshold for zero ratio filtering, only for "SCT" datasets and cells with higher zero ratio will be removed
    cell_type_col: "cell_type"  # Column name for cell types in single-cell dataset
    cell_subtype_col: "cell_subtype"  # Column name for cell subtypes in single-cell dataset
