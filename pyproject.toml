[project]
name = "simutme"
version = "0.4.0"
description = ""
authors = [
    {name = "OnlyBelter",email = "onlybelter@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "pyyaml (>=6.0.0,<7.0.0)",
    "joblib (>=1.4.0,<2.0.0)",
    "scienceplots (>=2.2.0,<3.0.0)",
    "scanpy (>=1.11.5,<2.0.0)",
    "tqdm (>=4.66.0,<5.0.0)",
    "dirichlet (>=1.0.0,<2.0.0)",
    "numpy (>=1.26,<2.3)",
    "scipy (>=1.12,<1.16)",
    "anndata==0.12.16",
]

[tool.poetry]
packages = [{include = "simutme", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
