<text x="600.0" y="183.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">Load YAML config (paths/constants/parameters) and</text>
<text x="600.0" y="203.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">dataset params</text>
