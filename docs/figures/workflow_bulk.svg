<rect x="90" y="656" width="1020" height="95" rx="12" ry="12" fill="#e6fff0" stroke="#2f2f2f" stroke-width="2"/>
<text x="600.0" y="699.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">Mix into bulk GEPs (simu_method = &quot;mul&quot;) and write</text>
<text x="600.0" y="719.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">.h5ad</text>
