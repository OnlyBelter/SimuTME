<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f2f2f"/></marker>
</defs>
<text x="600.0" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#111">SimuTME Workflow: Mixed Bulk RNA-seq Simulation</text>
<rect x="90" y="140" width="1020" height="95" rx="12" ry="12" fill="#e8f4ff" stroke="#2f2f2f" stroke-width="2"/>
<text x="600.0" y="183.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">Load YAML config and resolve SCT / filtering</text>
<text x="600.0" y="203.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">references</text>
<rect x="90" y="269" width="1020" height="95" rx="12" ry="12" fill="#e8f4ff" stroke="#2f2f2f" stroke-width="2"/>
<text x="600.0" y="302.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">Resolve shared gene set G before generation</text>
<text x="600.0" y="322.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">(reference variance screen + high-corr gene</text>
<text x="600.0" y="342.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">selection)</text>
<rect x="90" y="398" width="1020" height="95" rx="12" ry="12" fill="#fff5e6" stroke="#2f2f2f" stroke-width="2"/>
<text x="600.0" y="441.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">Generate cell-type proportions and sample SCT</text>
<text x="600.0" y="461.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">profiles</text>
<rect x="90" y="527" width="1020" height="95" rx="12" ry="12" fill="#fff5e6" stroke="#2f2f2f" stroke-width="2"/>
<text x="600.0" y="580.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">Mix candidate bulk GEPs in linear expression space</text>
<rect x="90" y="656" width="1020" height="95" rx="12" ry="12" fill="#e6fff0" stroke="#2f2f2f" stroke-width="2"/>
<text x="600.0" y="699.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">Apply shared G to reference and simulated profiles;</text>
<text x="600.0" y="719.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">normalize for comparison</text>
<rect x="90" y="785" width="1020" height="95" rx="12" ry="12" fill="#fde8ef" stroke="#2f2f2f" stroke-width="2"/>
<text x="600.0" y="828.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">Optional: filter by gene ranges and reference-based</text>
<text x="600.0" y="848.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">GEP criteria in the configured expression space</text>
<rect x="90" y="914" width="1020" height="95" rx="12" ry="12" fill="#e6fff0" stroke="#2f2f2f" stroke-width="2"/>
<text x="600.0" y="957.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">Save profiles as log2(TPM + 1) with matching cell</text>
<text x="600.0" y="977.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">fractions and summaries</text>
<rect x="90" y="1043" width="1020" height="95" rx="12" ry="12" fill="#fde8ef" stroke="#2f2f2f" stroke-width="2"/>
<text x="600.0" y="1096.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">Optional: comparison PCA and diagnostics</text>
<line x1="600.0" y1="235" x2="600.0" y2="269" stroke="#2f2f2f" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="600.0" y1="364" x2="600.0" y2="398" stroke="#2f2f2f" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="600.0" y1="493" x2="600.0" y2="527" stroke="#2f2f2f" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="600.0" y1="622" x2="600.0" y2="656" stroke="#2f2f2f" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="600.0" y1="751" x2="600.0" y2="785" stroke="#2f2f2f" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="600.0" y1="880" x2="600.0" y2="914" stroke="#2f2f2f" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="600.0" y1="1009" x2="600.0" y2="1043" stroke="#2f2f2f" stroke-width="2" marker-end="url(#arrow)"/>
</svg>