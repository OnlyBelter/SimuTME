<text x="600.0" y="312.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">Initialize BulkGEPGenerator (merged scRNA-seq +</text>
<text x="600.0" y="332.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">optional SCT ref)</text>
<rect x="90" y="398" width="1020" height="95" rx="12" ry="12" fill="#fff5e6" stroke="#2f2f2f" stroke-width="2"/>
<text x="600.0" y="441.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">Generate cell-type proportions</text>
<text x="600.0" y="461.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">(sampling_method_prop)</text>
<rect x="90" y="527" width="1020" height="95" rx="12" ry="12" fill="#fff5e6" stroke="#2f2f2f" stroke-width="2"/>
