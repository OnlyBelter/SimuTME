name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: simutme-ci
          python-version: "3.12"
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: false

      - name: Install scientific dependencies
        run: conda install -y --override-channels -c conda-forge "numpy>=1.26,<2.3" "scipy>=1.12,<1.16" "anndata=0.12.16"

      - name: Install SimuTME and pytest
        run: python -m pip install -e . pytest

      - name: Check dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q
